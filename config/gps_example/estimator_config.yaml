%YAML:1.0 # need to specify the file type at the top!

# ==================================================================
# Worked example: single-filter GPS fusion on top of a rpng_aruco-style rig.
# Copy this folder, then:
#  (1) replace kalibr_imu_chain.yaml / kalibr_imucam_chain.yaml with your own calibration,
#  (2) set gps_leverarm_prior to your antenna's real offset from the IMU (meters, in the IMU frame),
#  (3) set "topic_gps" below (or override with the ROS param topic_gps) to your sensor_msgs/NavSatFix topic,
#  (4) tune gps_init_min_baseline/gps_init_min_excursion to match how far your platform typically
#      travels (non-collinearly!) before you expect good GPS coverage -- see UpdaterGPS.h for why
#      yaw needs a genuinely 2D excursion to become observable.
# See ov_msckf/src/update/UpdaterGPS.h for the full design (coupling classification, why no interpolation,
# delayed initialization, chi2 gating, etc).
# ==================================================================

verbosity: "INFO" # ALL, DEBUG, INFO, WARNING, ERROR, SILENT

use_fej: true # if first-estimate Jacobians should be used (enable for good consistency)
integration: "rk4" # discrete, rk4, analytical (if rk4 or analytical used then analytical covariance propagation is used)
use_stereo: true # if we have more than 1 camera, if we should try to track stereo constraints
max_cameras: 2 # how many cameras we have 1 = mono, 2 = stereo, >2 = binocular (all mono tracking)

calib_cam_extrinsics: true
calib_cam_intrinsics: true
calib_cam_timeoffset: true
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 11
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 50
dt_slam_delay: 2

gravity_mag: 9.81

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

# zero velocity update parameters we can use
# we support either IMU-based or disparity detection.
try_zupt: false
zupt_chi2_multipler: 0 # set to 0 for only disp-based
zupt_max_velocity: 0.1
zupt_noise_multiplier: 50
zupt_max_disparity: 0.5 # set to 0 for only imu-based
zupt_only_at_beginning: true

# ==================================================================
# ==================================================================

# GPS fusion: single-filter, position-domain (i.e. loosely coupled -- the measurement is a receiver PVT
# solution, not raw pseudoranges). See ov_msckf/src/update/UpdaterGPS.h for the full design notes.
gps_enabled: false
gps_chi2_multipler: 5.0 # chi2 gate multiplier applied to both per-fix updates and the delayed-init gate
gps_noise_floor: 0.5 # minimum std (meters, per axis) we floor the reported fix covariance to
gps_noise_multiplier: 1.0 # multiplier applied to the (floored) covariance from the GPS message
gps_toff: 0.0 # fixed GPS-to-IMU time offset (seconds): t_imu = t_gps + toff. Assumes PPS-disciplined clocks.
gps_leverarm_prior: [0.0, 0.0, 0.0] # antenna lever arm p_ANTinI (meters) -- MEASURE this on your own rig!
gps_leverarm_prior_std: 0.05 # prior std (meters) for the lever arm if gps_do_calib_leverarm is true
gps_do_calib_leverarm: false # if we should estimate the antenna lever arm online
gps_init_min_meas: 30 # minimum accumulated GPS/VIO pairs before attempting delayed E-to-G initialization
gps_init_min_baseline: 5.0 # minimum baseline (meters) of the accumulated VIO positions before initializing
gps_init_min_excursion: 1.0 # minimum min-eigenvalue (m^2) of the XY spread, so yaw is observable (non-collinear path)
gps_init_max_pairs: 200 # cap on accumulated GPS/VIO pairs kept for delayed init (oldest dropped first), so
# stale pairs carrying accumulated VIO drift cannot fight the baseline-consistency check in try_initialize()
gps_reset_after_rejection_secs: 30.0 # how long a consecutive-rejection streak must last before tearing down
# the E-to-G transform and re-running delayed init (a duration, not a fix count -- see UpdaterGPS.h)
gps_gap_threshold_secs: 2.0 # a GPS gap longer than this counts as an outage (normal fix interval is 0.25s here)
gps_gap_drift_rate: 0.15 # assumed VIO drift (m/s) used to inflate the position covariance after an outage.
# Needed because the filter is measurably overconfident: across a 60s outage the true error grew 4.3x
# while its own 1-sigma grew only 1.6x, so the returning fix looked like a 15-sigma outlier and was
# rejected -- and rejected fixes carry no information, so it never recovered. See UpdaterGPS.h.
gps_gap_max_sigma: 25.0 # ceiling (meters, 1-sigma) on the cumulative inflation one outage may apply. The
# inflation escalates on every post-gap fix until one is accepted, since a single under-sized inflation
# just restores the rejection cascade; this bounds that escalation so the gate cannot be widened until it
# stops rejecting multipath. On hitting it we stop and let gps_reset_after_rejection_secs take over.
gps_max_late_dt: 0.5 # fixes older than (state time - this) are dropped with a warning instead of processed
topic_gps: "/gps/fix" # ROS topic for sensor_msgs/NavSatFix (overridable via ROS param topic_gps, e.g. -p topic_gps:=...)
# gps_datum: [42.293227, -71.263640, 50.0] # optional fixed [lat, lon, alt] datum; if omitted the first valid fix is used

# ==================================================================
# ==================================================================

init_window_time: 2.0
init_imu_thresh: 1.2
init_max_disparity: 2.0
init_max_features: 50

init_dyn_use: false
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 10.0

init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-20

init_dyn_bias_g: [0.0, 0.0, 0.0]
init_dyn_bias_a: [0.0, 0.0, 0.0]

# ==================================================================
# ==================================================================

record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"

save_total_state: false
filepath_est: "/tmp/ov_estimate.txt"
filepath_std: "/tmp/ov_estimate_std.txt"
filepath_gt: "/tmp/ov_groundtruth.txt"

# ==================================================================
# ==================================================================

# our front-end feature tracking parameters
# we have a KLT and descriptor based (KLT is better implemented...)
use_klt: true
num_pts: 150
fast_threshold: 30
grid_x: 5
grid_y: 5
min_px_dist: 20
knn_ratio: 0.85
track_frequency: 21.0
downsample_cameras: false
num_opencv_threads: 4 # -1: auto, 0-1: serial, >1: number of threads
histogram_method: "HISTOGRAM" # NONE, HISTOGRAM, CLAHE

# aruco tag tracker for the system
# DICT_6X6_1000 from https://chev.me/arucogen/
use_aruco: true
num_aruco: 1024
downsize_aruco: true

# ==================================================================
# ==================================================================

# camera noises and chi-squared threshold multipliers
up_msckf_sigma_px: 1.5
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1.5
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 2.0
up_aruco_chi2_multipler: 10

# masks for our images
use_mask: false

# imu and camera spacial-temporal
# imu config should also have the correct noise values
relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"



